# Este flujo se ejecuta automáticamente en cada push y pull request a la rama "master".
# Realiza la compilación del proyecto y ejecuta las pruebas unitarias para garantizar la calidad del código.

name: CI de Android para RAYMI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  pruebas_unitarias:
    name: Ejecutar Pruebas Unitarias
    runs-on: ubuntu-latest
    steps:
      # Paso 1: Obtener el código del repositorio
      - name: Obtener código del repositorio
        uses: actions/checkout@v4

      # Paso 2: Configurar el entorno de Java (JDK 17)
      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Paso 3: Cachear las dependencias de Gradle para acelerar futuras ejecuciones
      - name: Cachear dependencias de Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Paso 4: Otorgar permisos de ejecución al script gradlew
      - name: Dar permisos de ejecución a gradlew
        run: chmod +x gradlew

      # Paso 5: Ejecutar las pruebas unitarias
      - name: Ejecutar pruebas unitarias
        run: ./gradlew test

      # Paso 6: Subir los reportes de prueba como artefacto (siempre, incluso si las pruebas fallan)
      - name: Subir resultados de las pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas
          path: app/build/reports/tests/
